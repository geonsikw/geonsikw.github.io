<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geonsikw | Security Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<header>
    <h1>GEONSIKW SECURITY LAB</h1>
</header>

<div class="container">
    <article id="content">
        글을 불러오는 중입니다...
    </article>
</div>

<script>
    // 1. 읽어올 파일 이름을 여기에 적으세요. (나중엔 클릭으로 바꿀 수 있습니다)
    const targetPost = 'posts/my-project.md';

    async function loadPost() {
        try {
            const response = await fetch(targetPost);
            if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');
            
            let text = await response.text();
            
            // Front Matter (--- 사이의 설정값) 제거 로직
            const cleanMarkdown = text.replace(/^---[\s\S]+?---/, '');
            
            // 마크다운을 HTML로 변환하여 출력
            document.getElementById('content').innerHTML = marked.parse(cleanMarkdown);
        } catch (error) {
            document.getElementById('content').innerHTML = `<h2>Error</h2><p>${error.message}</p>`;
        }
    }

    loadPost();
</script>

</body>
</html>
