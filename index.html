<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gwoo Blog Style</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<nav>
    <h3>PROJECTS</h3>
    <ul>
        <li onclick="filterCategory('projects')">Projects</li>
        <li onclick="filterCategory('notes')">Notes</li>
    </ul>
    <h3>LOGS</h3>
    <ul>
        <li onclick="filterCategory('logs')">신념의 기록</li>
    </ul>
</nav>

<main id="main-area">
    <h1 id="cat-title">Category: all</h1>
    <div id="card-grid" class="grid"></div>
    
    <div id="viewer">
        <div class="back-btn" onclick="showList()">← Back to list</div>
        <div id="post-content"></div>
    </div>
</main>

<script>
    // 글 데이터 관리 (나중에는 별도 JSON 파일로 빼면 더 편합니다)
    const posts = [
        { title: "New One", date: "2025-12-11", cat: "projects", summary: "프로젝트 카테고리 테스트", file: "my-project.md" },
        { title: "mini test", date: "2025-12-12", cat: "projects", summary: "table / image test", file: "test.md" }
    ];

    function filterCategory(cat) {
        showList();
        document.getElementById('cat-title').innerText = `Category: ${cat}`;
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '';

        posts.filter(p => p.cat === cat).forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h2>${p.title}</h2><p>${p.date} • ${p.cat}</p><p>${p.summary}</p>`;
            card.onclick = () => loadPost(p.file);
            grid.appendChild(card);
        });
    }

    async function loadPost(fileName) {
        const res = await fetch(`./posts/${fileName}`);
        const text = await res.text();
        const cleanMd = text.replace(/^---[\s\S]+?---/, '');
        
        document.getElementById('card-grid').style.display = 'none';
        document.getElementById('cat-title').style.display = 'none';
        const viewer = document.getElementById('viewer');
        viewer.classList.add('active');
        document.getElementById('post-content').innerHTML = marked.parse(cleanMd);
    }

    function showList() {
        document.getElementById('card-grid').style.display = 'grid';
        document.getElementById('cat-title').style.display = 'block';
        document.getElementById('viewer').classList.remove('active');
    }

    // 초기 화면
    filterCategory('projects');
</script>
</body>
</html>
