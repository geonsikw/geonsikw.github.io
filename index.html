<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geonsikw | Security Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<header>
    <h1>GEONSIKW SECURITY LAB</h1>
</header>

<div class="container">
    <article id="content">
        글을 불러오는 중입니다...
    </article>
</div>

<script>
    // 경로 앞에 './'를 붙여 현재 디렉토리 기준임을 명시합니다.
    const targetPost = './posts/my-project.md';

    async function loadPost() {
        const contentDiv = document.getElementById('content');
        try {
            // 캐시 문제를 방지하기 위해 쿼리 스트링을 살짝 붙입니다.
            const response = await fetch(targetPost + '?v=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error(`파일을 불러오지 못했습니다. (Status: ${response.status})`);
            }
            
            let text = await response.text();
            
            // Front Matter(--- 사이 설정) 제거
            const cleanMarkdown = text.replace(/^---[\s\S]+?---/, '');
            
            // 마크다운 변환
            contentDiv.innerHTML = marked.parse(cleanMarkdown);
        } catch (error) {
            console.error(error);
            contentDiv.innerHTML = `
                <h2>오류 발생</h2>
                <p>${error.message}</p>
                <p><strong>체크리스트:</strong></p>
                <ul style="text-align: left; display: inline-block;">
                    <li>posts 폴더 안에 my-project.md가 있는지 확인</li>
                    <li>파일명이 모두 소문자인지 확인</li>
                    <li>GitHub Actions 빌드가 완료되었는지 확인</li>
                </ul>
            `;
        }
    }

    loadPost();
</script>

</body>
</html>
